services:
  postgres:
    image: postgres:16
    container_name: campus_connect_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: campus_connect
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: campus_secret
    ports:
      - "5432:5432"
    volumes:
      - campus_pgdata:/var/lib/postgresql/data

volumes:
  campus_pgdata:
